<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>tobi@terminal:~$ Portfolio</title>
  <link rel="icon" href="images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Fira Code", monospace;
      overflow: hidden;
      height: 100vh;
      transition: all 0.3s ease;
      position: relative;
    }

    #theme-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .theme-btn:hover {
      transform: scale(1.15);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .theme-btn.active {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
      transform: scale(1.05);
    }

    .theme-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      border: 1px solid var(--primary);
    }

    .theme-btn:hover::after {
      opacity: 1;
    }

    #theme-matrix { background: linear-gradient(135deg, #0a0e14 0%, #00ff41 100%); }
    #theme-cyberpunk { background: linear-gradient(135deg, #0f0f23 0%, #ff00ff 50%, #00ffff 100%); }
    #theme-dracula { background: linear-gradient(135deg, #282a36 0%, #50fa7b 100%); }
    #theme-nord { background: linear-gradient(135deg, #2e3440 0%, #88c0d0 100%); }
    #theme-monokai { background: linear-gradient(135deg, #272822 0%, #a6e22e 100%); }
    #theme-light { background: linear-gradient(135deg, #f5f5f5 0%, #2e7d32 100%); }

    /* Light Theme (Default) */
    body {
      background-color: #f5f5f5;
      --primary: #2e7d32;
      --secondary: #0277bd;
      --background: #f5f5f5;
      --text: #1a1a1a;
      --accent: #f57c00;
      --error: #c62828;
      --muted: #757575;
    }

    /* Matrix Theme */
    body.theme-matrix {
      background-color: #0a0e14;
      --primary: #00ff41;
      --secondary: #00bcd4;
      --background: #0a0e14;
      --text: #00ff41;
      --accent: #ffcc00;
      --error: #ff6b6b;
      --muted: #8b949e;
    }

    /* Cyberpunk Theme */
    body.theme-cyberpunk {
      background-color: #0f0f23;
      --primary: #ff00ff;
      --secondary: #00ffff;
      --background: #0f0f23;
      --text: #ff00ff;
      --accent: #ffff00;
      --error: #ff0055;
      --muted: #6a6a8e;
    }

    /* Dracula Theme */
    body.theme-dracula {
      background-color: #282a36;
      --primary: #50fa7b;
      --secondary: #8be9fd;
      --background: #282a36;
      --text: #f8f8f2;
      --accent: #ffb86c;
      --error: #ff5555;
      --muted: #6272a4;
    }

    /* Nord Theme */
    body.theme-nord {
      background-color: #2e3440;
      --primary: #88c0d0;
      --secondary: #81a1c1;
      --background: #2e3440;
      --text: #d8dee9;
      --accent: #ebcb8b;
      --error: #bf616a;
      --muted: #4c566a;
    }

    /* Monokai Theme */
    body.theme-monokai {
      background-color: #272822;
      --primary: #a6e22e;
      --secondary: #66d9ef;
      --background: #272822;
      --text: #f8f8f2;
      --accent: #e6db74;
      --error: #f92672;
      --muted: #75715e;
    }

    #terminal {
      height: 100vh;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background-color: var(--background);
      color: var(--text);
    }

    #output {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .line {
      margin: 5px 0;
      line-height: 1.6;
      color: var(--text);
    }

    .prompt {
      color: var(--primary);
      font-weight: bold;
    }

    .command {
      color: var(--secondary);
    }

    .error {
      color: var(--error);
    }

    .header {
      color: var(--accent);
      font-weight: bold;
      margin-top: 15px;
    }

    .link {
      color: var(--secondary);
      text-decoration: underline;
      cursor: pointer;
    }

    .link:hover {
      color: var(--primary);
    }

    #input-line {
      display: flex;
      align-items: center;
    }

    #input-prompt {
      color: var(--primary);
      font-weight: bold;
      margin-right: 8px;
      white-space: nowrap;
    }

    #command-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--secondary);
      font-family: "Fira Code", monospace;
      font-size: 16px;
      outline: none;
      caret-color: var(--primary);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background-color: var(--primary);
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .ascii-art {
      color: var(--primary);
      font-size: 12px;
      line-height: 1.2;
      white-space: pre;
      margin: 10px 0;
    }

    .tech-tag {
      display: inline-block;
      background-color: rgba(0, 255, 65, 0.1);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      margin: 2px;
      border-radius: 3px;
      font-size: 13px;
      color: var(--text);
    }

    .project-item {
      margin: 8px 0;
      padding-left: 15px;
    }

    #terminal::-webkit-scrollbar {
      width: 8px;
    }

    #terminal::-webkit-scrollbar-track {
      background: var(--background);
    }

    #terminal::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      body {
        font-size: 14px;
      }
      
      #terminal {
        padding: 10px;
      }
      
      #theme-selector {
        top: 10px;
        right: 10px;
        padding: 6px;
        gap: 6px;
      }
      
      .theme-btn {
        width: 28px;
        height: 28px;
      }
      
      .theme-btn::after {
        display: none; /* Hide tooltips on mobile */
      }
      
      #input-prompt {
        font-size: 14px;
      }
      
      #command-input {
        font-size: 14px;
      }
      
      .ascii-art {
        font-size: 10px;
      }
      
      .tech-tag {
        font-size: 11px;
        padding: 1px 6px;
      }
    }

    @media (max-width: 480px) {
      #terminal {
        padding: 8px;
      }
      
      #theme-selector {
        padding: 5px;
        gap: 5px;
      }
      
      .theme-btn {
        width: 24px;
        height: 24px;
      }
      
      .line {
        font-size: 13px;
      }
      
      #input-prompt {
        font-size: 13px;
      }
      
      #command-input {
        font-size: 13px;
      }
    }

    /* iPad and tablet optimizations */
    @media (min-width: 768px) and (max-width: 1024px) {
      #terminal {
        padding: 15px;
      }
      
      body {
        font-size: 15px;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) and (pointer: coarse) {
      .theme-btn {
        width: 40px;
        height: 40px;
      }
      
      .link {
        padding: 4px;
        display: inline-block;
      }
      
      #command-input {
        font-size: 16px; /* Prevents zoom on iOS */
      }
    }
  </style>
</head>
<body>
  <!-- Theme Selector -->
  <div id="theme-selector">
    <button class="theme-btn" id="theme-matrix" data-tooltip="Matrix" onclick="changeTheme('matrix')"></button>
    <button class="theme-btn" id="theme-cyberpunk" data-tooltip="Cyberpunk" onclick="changeTheme('cyberpunk')"></button>
    <button class="theme-btn" id="theme-dracula" data-tooltip="Dracula" onclick="changeTheme('dracula')"></button>
    <button class="theme-btn" id="theme-nord" data-tooltip="Nord" onclick="changeTheme('nord')"></button>
    <button class="theme-btn" id="theme-monokai" data-tooltip="Monokai" onclick="changeTheme('monokai')"></button>
    <button class="theme-btn active" id="theme-light" data-tooltip="Light" onclick="changeTheme('light')"></button>
  </div>

  <div id="terminal">
    <div id="output"></div>
    <div id="input-line">
      <span id="input-prompt">tobi@portfolio:~$</span>
      <input type="text" id="command-input" autofocus autocomplete="off" />
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('command-input');
    const commandHistory = [];
    let historyIndex = -1;
    let matrixInterval = null;
    let isAnimating = false;

    const asciiLogo = `
 ████████╗ ██████╗ ██████╗ ██╗
 ╚══██╔══╝██╔═══██╗██╔══██╗██║
    ██║   ██║   ██║██████╔╝██║
    ██║   ██║   ██║██╔══██╗██║
    ██║   ╚██████╔╝██████╔╝██║
    ╚═╝    ╚═════╝ ╚═════╝ ╚═╝
`;

    const commands = {
      help: () => {
        return `
<span class="header">Available Commands:</span>
  <span class="command">about</span>      - Learn about me
  <span class="command">skills</span>     - View my tech stack
  <span class="command">projects</span>   - Browse my projects
  <span class="command">mlops</span>      - Explore my ML/AI experience
  <span class="command">ai-game</span>    - Play the tech guessing game
  <span class="command">matrix</span>     - Enter the Matrix 😎
  <span class="command">hack</span>       - Run a "hacking" simulation
  <span class="command">contact</span>    - Get in touch
  <span class="command">resume</span>     - Download my resume

  <span class="command">linkedin</span>   - Open my LinkedIn profile
  <span class="command">history</span>    - Show command history
  <span class="command">clear</span>      - Clear terminal
  <span class="command">help</span>       - Show this help message
`;
      },

      about: () => {
        return `
<span class="header">$ whoami</span>
Name: Tobi Ajetomobi
Role: Cloud & Platform Engineer

I'm a Cloud & Platform Engineer with hands-on experience across AWS and Azure,

<span style="color: var(--accent);">MLOps:</span>          Model deployment, retraining pipelines, drift monitoring
`;

<span class="project-item">> <span class="link" onclick="window.open('https://tobiajet.github.io/HTML-Form-with-JSON/', '_blank')">HTML Form with JSON</span></span>

<span style="color: var(--muted);">Type '<span class="command">github</span>' to view all repositories</span>
`;
      },

      mlops: () => {
        return `
<span class="header">$ cat ml_ops.txt</span>

<span style="color: var(--accent); font-weight:bold;">MLOps & AI Infrastructure</span>

Deployed ML Models in AKS, following the MLOps Process

<span style="color: var(--primary);">Key Tools:</span>
Kubernetes, MLflow, Docker

<span style="color: var(--primary);">Experience:</span>
- Deploying ML models on K8s clusters
- Automating retraining and model rollouts via CI/CD pipelines
- Monitoring model performance & drift using Arize AI
- Managing reproducibility with MLflow

<span style="color: var(--muted); font-style: italic;">// Type '<span class="command">projects</span>' to explore more work or '<span class="command">help</span>' for other commands</span>
`;
      },

      'ai-game': () => {
        const techs = [
          {
            answer: ['kubernetes', 'k8s'],
            display: 'Kubernetes',
            hints: [
              'It\'s a CNCF graduated project',
              'It orchestrates containerized workloads across clusters',
              'Greek word meaning "helmsman" or "pilot"'
            ],
            extraHint: 'Originally developed by Google. Abbreviated as "K8s".',
            fact: 'K8s can run thousands of containers across hundreds of nodes with built-in self-healing.'
          },
          {
            answer: ['terraform'],
            display: 'Terraform',
            hints: [
              'It\'s an open-source tool by HashiCorp',
              'It uses a declarative language called HCL',
              'It lets you provision infrastructure across multiple cloud providers'
            ],
            extraHint: 'Its workflow is: write → plan → apply. State is stored in a .tfstate file.',
            fact: 'Terraform can manage resources across AWS, Azure, GCP, and 1000+ other providers simultaneously.'
          },
          {
            answer: ['docker'],
            display: 'Docker',
            hints: [
              'It packages applications into portable, isolated units',
              'It uses a layered filesystem and a client-daemon architecture',
              'Its mascot is a whale carrying containers'
            ],
            extraHint: 'The open-source core project is called "Moby". Created by Solomon Hykes in 2013.',
            fact: 'A Docker image can be as small as 5MB, compared to a full VM which can be several GBs.'
          },
          {
            answer: ['helm'],
            display: 'Helm',
            hints: [
              'It\'s known as the package manager for a popular orchestrator',
              'It uses "Charts" to define, install, and upgrade applications',
              'Its name is a nautical term — fitting for the platform it manages'
            ],
            extraHint: 'Helm charts are like apt/yum packages but for Kubernetes. Repos like Artifact Hub host thousands of them.',
            fact: 'Helm manages the full lifecycle of Kubernetes apps — install, upgrade, rollback, and uninstall.'
          },
          {
            answer: ['prometheus'],
            display: 'Prometheus',
            hints: [
              'It\'s a CNCF graduated monitoring and alerting toolkit',
              'It scrapes metrics from targets at defined intervals',
              'Named after the Greek Titan who stole fire from the gods'
            ],
            extraHint: 'It stores data as time-series and uses a query language called PromQL.',
            fact: 'Prometheus was originally built at SoundCloud in 2012 before being open-sourced.'
          },
          {
            answer: ['argocd', 'argo cd', 'argo'],
            display: 'Argo CD',
            hints: [
              'It\'s a declarative, GitOps continuous delivery tool',
              'It continuously syncs your cluster state to match a Git repository',
              'Named after a ship from Greek mythology'
            ],
            extraHint: 'It\'s Kubernetes-native and gives you a visual UI showing the live state of your deployments vs Git.',
            fact: 'Argo CD can manage deployments across multiple Kubernetes clusters from a single control plane.'
          }
        ];

        const idx = Math.floor(Math.random() * techs.length);
        window._aiGame = { tech: techs[idx], attempts: 0 };

        const hints = techs[idx].hints.map((h, i) => `  ${i + 1}. ${h}`).join('\n');
        return `
<span class="header">$ python3 guess_the_tech.py</span>

<span style="color: var(--accent);">DevOps Tech Guesser</span>
I'm thinking of a DevOps/Cloud technology — you have 3 tries!

<span style="color: var(--primary);">Hints:</span>
${hints}

Type: <span class="command">guess [technology]</span>
Or:   <span class="command">ai-hint</span> for an extra clue
`;
      },

      'ai-hint': () => {
        if (!window._aiGame) {
          return `<span class="error">Start a game first with: <span class="command">ai-game</span></span>`;
        }
        return `<span style="color: var(--accent);">Extra Hint:</span> ${window._aiGame.tech.extraHint}\n\nType: <span class="command">guess [your answer]</span>`;
      },

      matrix: () => {
        startMatrixRain();
        return `<span style="color: var(--primary);">Entering the Matrix... Press ESC to exit</span>`;
      },

      hack: () => {
        startHackingSimulation();
        return null;
      },

      sudo: () => {
        return `
<span style="color: var(--error);">[sudo] password for tobi: </span>
<span style="color: var(--muted);">Nice try! 😄 But you don't have sudo access here.</span>
<span style="color: var(--accent);">Try '<span class="command">hack</span>' for something fun instead!</span>
`;
      },

      contact: () => {
        return `
<span class="header">$ cat contact.info</span>

Email: <span class="link" onclick="window.location.href='mailto:tobiajetomobi@gmail.com'">tobiajetomobi@gmail.com</span>
LinkedIn: <span class="link" onclick="window.open('https://www.linkedin.com/in/tobiajetomobi/', '_blank')">linkedin.com/in/tobiajetomobi</span>
GitHub: <span class="link" onclick="window.open('https://github.com/Tobi-Ajet/', '_blank')">github.com/Tobi-Ajet</span>

<span style="color: var(--accent);">Want to collaborate or talk DevOps? Let's connect!</span>
`;
      },

      resume: () => {
        return `
<span class="header">$ cat resume.txt</span>

<span style="color: var(--accent); font-weight: bold;">Tobi Ajetomobi</span> — Cloud & Platform Engineer
<span style="color: var(--muted);">tobiajetomobi@gmail.com · linkedin.com/in/tobiajetomobi</span>

<span style="color: var(--primary);">Experience</span>
  Cloud & Platform Engineer
  · Managing Kubernetes clusters on AWS (EKS/ECS) and Azure (AKS)
  · Designing and maintaining CI/CD pipelines with Concourse CI
  · Infrastructure as code with Terraform and Helm
  · MLOps: model deployment, retraining pipelines, drift monitoring (Arize AI)

<span style="color: var(--primary);">Skills</span>
  Kubernetes · Terraform · Helm · AWS · Azure · Python · Bash · PostgreSQL

<span style="color: var(--muted);">For full CV, connect on LinkedIn:</span>
<span class="link" onclick="window.open('https://www.linkedin.com/in/tobiajetomobi/', '_blank')">linkedin.com/in/tobiajetomobi</span>
`;
      },

      github: () => {
        window.open('https://github.com/Tobi-Ajet/', '_blank');
        return `<span style="color: var(--accent);">Opening GitHub profile...</span>`;
      },

      linkedin: () => {
        window.open('https://www.linkedin.com/in/tobiajetomobi/', '_blank');
        return `<span style="color: var(--accent);">Opening LinkedIn profile...</span>`;
      },

      clear: () => {
        output.innerHTML = '';
        return null;
      },

      history: () => {
        if (commandHistory.length === 0) {
          return `<span style="color: var(--muted);">No command history yet.</span>`;
        }

        const historyList = commandHistory
          .map((cmd, index) => `  ${index + 1}  ${cmd}`)
          .join('\n');

        return `<span class="header">$ history</span>\n${historyList}`;
      },

      guess: (args) => {
        const answer = args ? args.toLowerCase().trim() : '';

        if (!answer) {
          return `<span class="error">Usage: guess [technology-name]</span>`;
        }

        if (!window._aiGame) {
          return `<span class="error">Start a game first with: <span class="command">ai-game</span></span>`;
        }

        const { tech } = window._aiGame;
        window._aiGame.attempts++;

        if (tech.answer.includes(answer)) {
          const attemptsText = window._aiGame.attempts === 1 ? 'on the first try!' : `in ${window._aiGame.attempts} attempts.`;
          window._aiGame = null;
          return `
<span style="color: var(--primary); font-weight: bold;">CORRECT! It's ${tech.display}!</span> ${attemptsText}

<span style="color: var(--accent);">Did you know?</span> ${tech.fact}

Type '<span class="command">ai-game</span>' to play again or '<span class="command">help</span>' for other commands.
`;
        }

        const attemptsLeft = 3 - window._aiGame.attempts;
        if (attemptsLeft <= 0) {
          const correct = tech.display;
          window._aiGame = null;
          return `
<span style="color: var(--error);">Out of tries! The answer was: <span style="color: var(--accent);">${correct}</span></span>

Type '<span class="command">ai-game</span>' to try again.
`;
        }

        return `<span style="color: var(--error);">"${answer}" is not correct.</span> ${attemptsLeft} attempt${attemptsLeft > 1 ? 's' : ''} left. Type <span class="command">ai-hint</span> for a clue.`;
      },

      ls: () => commands.projects(),
      whoami: () => commands.about(),
      cat: () => commands.about()
    };

    function printLine(content, className = '') {
      const line = document.createElement('div');
      line.className = `line ${className}`;
      line.innerHTML = content;
      output.appendChild(line);
      scrollToBottom();
    }

    function scrollToBottom() {
      output.scrollTop = output.scrollHeight;
    }

    // Matrix rain animation
    function startMatrixRain() {
      if (isAnimating) return;
      isAnimating = true;
      
      const matrixChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
      const columns = Math.floor(window.innerWidth / 20);
      let drops = Array(columns).fill(0);
      
      const canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.zIndex = '999';
      canvas.style.pointerEvents = 'none';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      matrixInterval = setInterval(() => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--primary');
        ctx.font = '15px monospace';
        
        for (let i = 0; i < drops.length; i++) {
          const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
          ctx.fillText(char, i * 20, drops[i] * 20);
          
          if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }, 50);
      
      const stopMatrix = (e) => {
        if (e.key === 'Escape') {
          clearInterval(matrixInterval);
          document.body.removeChild(canvas);
          document.removeEventListener('keydown', stopMatrix);
          isAnimating = false;
          printLine(`<span style="color: var(--accent);">Exited the Matrix.</span>`);
        }
      };
      
      document.addEventListener('keydown', stopMatrix);
    }

    // Hacking simulation
    async function startHackingSimulation() {
      if (isAnimating) return;
      isAnimating = true;
      input.disabled = true;
      
      const hackLines = [
        'Initializing breach protocol...',
        'Connecting to remote server 192.168.1.1...',
        '[████████████░░░░░░░░] 60%',
        'Bypassing firewall...',
        'Firewall bypassed successfully ✓',
        '[████████████████░░░░] 80%',
        'Extracting data...',
        'Located: /etc/secrets/portfolio_data.txt',
        '[████████████████████] 100%',
        '<span style="color: var(--primary);">ACCESS GRANTED ✓</span>',
        '',
        '<span style="color: var(--accent);">Just kidding! 😄</span>',
        '<span style="color: var(--muted);">This is just a fun simulation. Want to actually see my work?</span>',
        '<span style="color: var(--muted);">Try: <span class="command">projects</span> or <span class="command">github</span></span>'
      ];
      
      for (const line of hackLines) {
        await sleep(Math.random() * 300 + 200);
        printLine(line);
      }
      
      input.disabled = false;
      input.focus();
      isAnimating = false;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Typing animation for welcome message
    async function typeText(text, className = '') {
      const line = document.createElement('div');
      line.className = `line ${className}`;
      output.appendChild(line);
      
      for (let i = 0; i < text.length; i++) {
        line.innerHTML = text.substring(0, i + 1);
        await sleep(20);
        scrollToBottom();
      }
    }

    function executeCommand(cmd) {
      const trimmedCmd = cmd.trim();
      
      if (trimmedCmd === '' || isAnimating) return;

      printLine(`<span class="prompt">tobi@portfolio:~$</span> <span class="command">${cmd}</span>`);

      // Handle commands with arguments (like 'guess kubernetes')
      const [mainCmd, ...args] = trimmedCmd.toLowerCase().split(' ');
      const argsString = args.join(' ');

      if (commands[mainCmd]) {
        const result = typeof commands[mainCmd] === 'function' 
          ? commands[mainCmd](argsString) 
          : commands[mainCmd];
        if (result !== null) {
          printLine(result);
        }
      } else {
        printLine(`<span class="error">Command not found: ${mainCmd}</span>`, 'error');
        printLine(`Type '<span class="command">help</span>' to see available commands.`);
      }

      commandHistory.push(cmd);
      historyIndex = commandHistory.length;
    }

    function changeTheme(themeName) {
      // Update body class
      document.body.className = '';
      if (themeName !== 'light') {
        document.body.classList.add(`theme-${themeName}`);
      }
      
      // Update active button
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`theme-${themeName}`).classList.add('active');
      
      // Save theme preference
      try {
        localStorage.setItem('terminal-theme', themeName);
      } catch (e) {
        // Ignore localStorage errors
      }
    }

    function showWelcome() {
      printLine(`<div class="ascii-art">${asciiLogo}</div>`);
      printLine(`<span style="color: var(--accent);">Welcome to Tobi's Terminal Portfolio</span>`);
      printLine(`<span style="color: var(--muted);">Cloud & Platform Engineer | AWS · Azure · EKS · MLOps</span>`);
      printLine('');
      printLine(`Type '<span class="command">help</span>' to see available commands.`);
      printLine(`<span style="color: var(--muted); font-style: italic;">Tip: Try typing '<span class="command">matrix</span>' or '<span class="command">hack</span>' for something cool!</span>`);
      printLine('');
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault(); // Prevent form submission on mobile
        const cmd = input.value;
        executeCommand(cmd);
        input.value = '';
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIndex > 0) {
          historyIndex--;
          input.value = commandHistory[historyIndex];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          input.value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          input.value = '';
        }
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const partial = input.value.toLowerCase();
        const matches = Object.keys(commands).filter(cmd => cmd.startsWith(partial));
        if (matches.length === 1) {
          input.value = matches[0];
        }
      }
    });

    // Keep input focused (with mobile-friendly approach)
    document.addEventListener('click', (e) => {
      // Don't refocus if clicking on a link
      if (e.target.tagName !== 'A' && !e.target.classList.contains('link')) {
        input.focus();
      }
    });
    
    // Prevent zoom on double tap for iOS
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    
    // Load saved theme or default to light
    try {
      const savedTheme = localStorage.getItem('terminal-theme');
      if (savedTheme) {
        changeTheme(savedTheme);
      } else {
        changeTheme('light');
      }
    } catch (e) {
      // Ignore localStorage errors, default is already light
    }
    
    // Initialize
    showWelcome();
    input.focus();

    // Make changeTheme globally accessible
    window.changeTheme = changeTheme;
  </script>
</body>
</html>
